buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '0.1.52.beta'
group = 'com.xyazh.kanake'
archivesBaseName = 'kanake'


sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

// Sources contain UTF-8 Chinese comments while javac on a Chinese Windows uses GBK by default,
// which fails with "unmappable character for encoding GBK" during a clean build.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            // ForgeGradle 3.0.197 leaves MC_VERSION as the literal "${MC_VERSION}" here.
            environment 'MC_VERSION', '1.12.2'
        }
        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            environment 'MC_VERSION', '1.12.2'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    //compileOnly(files("./libs/GalacticraftCore-Dev-1.12.2-4.0.2.261.jar"))
    //compileOnly(files("./libs/Galacticraft-Planets-Dev-1.12.2-4.0.2.261.jar"))
    //compileOnly(files("./libs/industrialcraft-2-2.8.100-ex112-dev.jar"))
    //compileOnly(files("./libs/jei_1.12.2-4.13.1.220.jar"))
    compileOnly(files("./libs/Baubles-1.12-1.5.2-deobf.jar"))
    // at runtime, use the full JEI jar
    //runtime "mezz.jei:jei_1.12.2-4.13.1.220"
    // The Baubles jar only exists in ./libs, no maven repository provides it.
    // The old "baubles:Baubles-1.12-1.5.2-deobf" coordinate cannot be resolved
    // (it breaks runClient and IDE import).
    runtimeOnly(files("./libs/Baubles-1.12-1.5.2-deobf.jar"))
}


repositories {
}

// Replace ${version} / ${mcversion} placeholders in mcmod.info, otherwise FML reports
// the literal placeholder as the mod version and cannot match the Minecraft version.
processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "kanake",
            "Specification-Vendor": "examplemodsareus",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"examplemodsareus",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

jar.finalizedBy('reobfJar') 


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

sourceSets { main { output.resourcesDir = output.classesDir } }

// ForgeGradle 3.0.197 writes .idea/runConfigurations/*.xml with a plain <component> root element.
// IntelliJ only loads files whose root is <component name="ProjectRunConfigurationManager">,
// so the generated runClient/runServer entries would not show up in the Run/Debug configurations.
task fixIntellijRuns {
    doLast {
        def dir = file('.idea/runConfigurations')
        if (dir.isDirectory()) {
            dir.listFiles()?.findAll { it.name.endsWith('.xml') }.each { f ->
                def text = f.getText('UTF-8')
                if (text.contains('<component>')) {
                    f.setText(text.replaceFirst('<component>', '<component name="ProjectRunConfigurationManager">'), 'UTF-8')
                }
            }
        }
    }
}

tasks.matching { it.name == 'genIntellijRuns' }.all { genTask ->
    genTask.finalizedBy fixIntellijRuns
}