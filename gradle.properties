# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
# net.minecraftforge.gradle.test_certs=false:
# ForgeGradle 3 runs a synchronous TLS self-test against maven.minecraftforge.net and
# libraries.minecraft.net while the plugin is applied. A single reset handshake aborts the
# whole build with "Failed to validate certificate ... outdated JDK". Disable that self-test.
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.test_certs=false
org.gradle.daemon=false
